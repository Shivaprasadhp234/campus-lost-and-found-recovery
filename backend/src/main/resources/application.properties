spring.application.name=lost-found-app
spring.profiles.default=local

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lost_found_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Shivu@234}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8081}
server.error.include-message=never
server.error.include-stacktrace=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
